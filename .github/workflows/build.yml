name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          COMMIT="${GITHUB_SHA::8}"
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.Commit=${COMMIT}" \
            -o prismbox \
            .

      - name: Verify binary
        run: |
          file prismbox
          ls -lh prismbox
          ./prismbox --help || true

      - name: Create checksum
        run: sha256sum prismbox > prismbox_linux_amd64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismbox-linux-amd64
          path: |
            prismbox
            prismbox_linux_amd64.sha256

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: prismbox-linux-amd64

      - name: Compress binary
        run: |
          chmod +x prismbox
          tar czf prismbox_linux_amd64.tar.gz prismbox
          sha256sum prismbox_linux_amd64.tar.gz > prismbox_linux_amd64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            prismbox
            prismbox_linux_amd64.sha256
            prismbox_linux_amd64.tar.gz
            prismbox_linux_amd64.tar.gz.sha256
