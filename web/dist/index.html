<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PrismBox - Modern Glassmorphism WebUI for sing-box client management">
  <title>PrismBox</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.0">
</head>
<body>
  <!-- Animated Ambient Background with Gradient Blobs -->
  <div class="ambient-background" aria-hidden="true">
    <div class="gradient-blob blob-1"></div>
    <div class="gradient-blob blob-2"></div>
    <div class="gradient-blob blob-3"></div>
    <div class="gradient-blob blob-4"></div>
    <div class="mesh-grid"></div>
  </div>

  <div class="app-shell">
    <!-- Left Glassmorphism Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="#/dashboard" class="brand-logo">
          <div class="logo-prism-icon">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="prismGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#818cf8"/>
                  <stop offset="50%" stop-color="#6366f1"/>
                  <stop offset="100%" stop-color="#4338ca"/>
                </linearGradient>
                <linearGradient id="prismGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#06b6d4"/>
                  <stop offset="100%" stop-color="#ec4899"/>
                </linearGradient>
              </defs>
              <polygon points="16,3 29,26 3,26" fill="url(#prismGrad1)" opacity="0.85"/>
              <polygon points="16,3 23,26 9,26" fill="url(#prismGrad2)" opacity="0.65"/>
              <polygon points="16,3 16,26 3,26" fill="#ffffff" opacity="0.2"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">PrismBox</span>
            <span class="brand-tag">v1.0.0</span>
          </div>
        </a>
        <button class="btn-icon mobile-close-btn" id="sidebar-close" aria-label="Close sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label" id="nav-section-main">MAIN NAVIGATION</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="#/dashboard" class="nav-link" data-route="dashboard">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="9" rx="1"/>
                <rect x="14" y="3" width="7" height="5" rx="1"/>
                <rect x="14" y="12" width="7" height="9" rx="1"/>
                <rect x="3" y="16" width="7" height="5" rx="1"/>
              </svg>
              <span class="nav-label" data-i18n="nav.dashboard">Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#/inbounds" class="nav-link" data-route="inbounds">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              </svg>
              <span class="nav-label" data-i18n="nav.inbounds">Inbounds</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#/outbounds" class="nav-link" data-route="outbounds">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
              <span class="nav-label" data-i18n="nav.outbounds">Outbounds</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#/routing" class="nav-link" data-route="routing">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="18" r="3"/>
                <circle cx="6" cy="6" r="3"/>
                <circle cx="18" cy="6" r="3"/>
                <path d="M6 9v3a3 3 0 0 0 3 3h6"/>
                <line x1="18" y1="9" x2="18" y2="15"/>
                <circle cx="18" cy="18" r="3"/>
              </svg>
              <span class="nav-label" data-i18n="nav.routing">Routing</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#/dns" class="nav-link" data-route="dns">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <circle cx="12" cy="11" r="2.5"/>
              </svg>
              <span class="nav-label" data-i18n="nav.dns">DNS</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#/config" class="nav-link" data-route="config">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              <span class="nav-label" data-i18n="nav.config">Config</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="core-info-pill">
          <div class="ws-indicator" id="ws-status-dot" title="WebSocket status"></div>
          <div class="core-info-text">
            <span class="core-title" data-i18n="nav.core_status">sing-box Core</span>
            <span class="core-sub" id="sidebar-ws-label">Connecting...</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main Container -->
    <div class="main-wrapper">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-icon mobile-menu-btn" id="mobile-menu-toggle" aria-label="Open menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="page-title-box">
            <h1 class="page-title" id="page-title">Dashboard</h1>
            <span class="page-subtitle" id="page-subtitle">Real-time status and traffic metrics</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Language Switcher EN / 中文 -->
          <div class="lang-switcher">
            <button class="btn-lang" id="btn-lang-toggle" title="Switch Language / 切换语言">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
              <span id="lang-indicator-text">EN</span>
            </button>
          </div>

          <!-- Kernel Status Badge -->
          <div class="kernel-status-badge unknown" id="kernel-status-badge">
            <span class="status-pulse-dot"></span>
            <span class="status-text" id="kernel-status-text">Kernel Unknown</span>
          </div>

          <!-- Kernel Control Buttons -->
          <div class="kernel-controls">
            <button class="btn btn-sm btn-success" id="btn-kernel-start" title="Start sing-box kernel">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span data-i18n="kernel.start">Start</span>
            </button>
            <button class="btn btn-sm btn-warning" id="btn-kernel-restart" title="Restart sing-box kernel">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
              <span data-i18n="kernel.restart">Restart</span>
            </button>
            <button class="btn btn-sm btn-danger" id="btn-kernel-stop" title="Stop sing-box kernel">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
              <span data-i18n="kernel.stop">Stop</span>
            </button>
          </div>

          <!-- "Save & Apply" Button - Primary Accent, Always Visible -->
          <button class="btn btn-sm btn-apply" id="btn-save-apply" title="Save config and restart kernel with validation">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            <span data-i18n="kernel.save_apply">Save & Apply</span>
          </button>
        </div>
      </header>

      <!-- Main Content Area (Rendered dynamically by active route) -->
      <main class="main-content" id="app">
        <!-- Rendered dynamically -->
      </main>
    </div>
  </div>

  <!-- Global Modal Dialog System -->
  <div class="modal-backdrop" id="modal-backdrop" style="display: none;">
    <div class="modal-dialog" id="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Dialog</h3>
        <button class="modal-close-btn" id="modal-close-btn" aria-label="Close dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Dynamic Modal Content -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-ghost" id="modal-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="modal-save-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- JavaScript Modules (Loaded in dependency order) -->
  <script src="js/i18n.js?v=1.0.0"></script>
  <script src="js/api.js?v=1.0.0"></script>
  <script src="js/dashboard.js?v=1.0.0"></script>
  <script src="js/inbounds.js?v=1.0.0"></script>
  <script src="js/outbounds.js?v=1.0.0"></script>
  <script src="js/routing.js?v=1.0.0"></script>
  <script src="js/dns.js?v=1.0.0"></script>
  <script src="js/config.js?v=1.0.0"></script>
  <script src="js/app.js?v=1.0.0"></script>
</body>
</html>
